
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Task</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
  <h1>Edit Task</h1>
  <p class="intro">Update the information for the selected task.</p>

  <a th:href="@{/}" class="btn secondary-btn">Back to Task List</a>

  <form th:action="@{/updateTask}" th:object="${task}" method="post">
    <input type="hidden" th:field="*{id}">

    <label>Task ID:</label>
    <p class="readonly-id" th:text="*{id}"></p>

    <label for="title">Title:</label>
    <input type="text" id="title" th:field="*{title}" required>

    <label for="description">Description:</label>
    <input type="text" id="description" th:field="*{description}" required>

    <label for="dueDate">Due Date:</label>
    <input type="date" id="dueDate" th:field="*{dueDate}" required>

    <label class="checkbox-label" for="completed">Completed:</label>
    <input type="checkbox" id="completed" th:field="*{completed}">

    <button type="submit">Save Changes</button>
  </form>
</div>
</body>
</html>
