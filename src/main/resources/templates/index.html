
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>


<body>
<div class="container">
    <h1>My Task List</h1>
    <p class="intro">Here is the list of tasks currently stored in the application.</p>

    <a th:href="@{/addTask}" class="btn">Add Task</a>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Due Date</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="task : ${tasks}">
            <td th:text="${task.id}"></td>
            <td th:text="${task.title}"></td>
            <td th:text="${task.description}"></td>
            <td th:text="${task.dueDate}"></td>
            <td>
                <span th:if="${task.completed}" class="status-done">Completed</span>
                <span th:unless="${task.completed}" class="status-pending">Not completed</span>
            </td>
            <td class="actions-cell">
                <span class="action-link disabled-link">Edit</span>
                <span class="separator">|</span>
                <span class="action-link disabled-link">Delete</span>
            </td>
            <td>
                <a th:href="@{'/editTask/' + ${task.id}}" class="action-link edit-link">Edit</a>
                <span class="action-link delete-link disabled-link">Delete</span>
            </td>

            <td>
                <a th:href="@{'/editTask/' + ${task.id}}" class="action-link edit-link">Edit</a>
                <a th:href="@{'/deleteTask/' + ${task.id}}"
                   class="action-link delete-link"
                   onclick="return confirm('Are you sure you want to delete this task?');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
